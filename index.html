<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Krishna's CSE Guiding BOT</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#0b1120;
    color:white;
    min-height:100vh;
}

.app{
    width:100%;
    max-width:900px;
    height:100vh;
    margin:auto;
    display:flex;
    flex-direction:column;
    background:#111827;
}

/* HEADER */

.header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    padding:18px;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:48px;
    height:48px;
    border-radius:50%;
    background:white;
    color:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
}

.header h1{
    font-size:20px;
}

.header p{
    font-size:12px;
    opacity:.85;
    margin-top:3px;
}

/* CHAT */

.chat{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.message{
    display:flex;
    margin-bottom:18px;
}

.bot{
    justify-content:flex-start;
}

.user{
    justify-content:flex-end;
}

.bubble{
    max-width:82%;
    padding:14px 16px;
    border-radius:17px;
    line-height:1.6;
    font-size:15px;
}

.bot .bubble{
    background:#1f2937;
    border-bottom-left-radius:5px;
}

.user .bubble{
    background:#2563eb;
    border-bottom-right-radius:5px;
}

.image-preview{
    max-width:220px;
    border-radius:12px;
    margin-bottom:8px;
    display:block;
}

/* INPUT */

.bottom{
    padding:12px;
    background:#0f172a;
    border-top:1px solid #263244;
}

.preview{
    display:none;
    padding:5px 10px;
}

.preview img{
    width:70px;
    height:70px;
    object-fit:cover;
    border-radius:10px;
}

.controls{
    display:flex;
    gap:8px;
}

textarea{
    flex:1;
    resize:none;
    height:48px;
    padding:14px;
    border:none;
    outline:none;
    border-radius:13px;
    background:#1f2937;
    color:white;
    font-size:15px;
}

textarea::placeholder{
    color:#9ca3af;
}

button{
    border:none;
    border-radius:12px;
    cursor:pointer;
    color:white;
}

.image-btn{
    width:48px;
    background:#374151;
    font-size:20px;
}

.send-btn{
    width:65px;
    background:#2563eb;
    font-weight:bold;
}

.send-btn:hover{
    background:#1d4ed8;
}

/* WELCOME */

.welcome{
    text-align:center;
    padding:45px 20px;
}

.welcome h2{
    font-size:28px;
    margin-bottom:10px;
}

.welcome p{
    color:#9ca3af;
    line-height:1.6;
}

.subjects{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:20px;
}

.subject{
    background:#1f2937;
    padding:8px 12px;
    border-radius:20px;
    font-size:12px;
    color:#d1d5db;
}

/* MOBILE */

@media(max-width:600px){

    .app{
        height:100vh;
    }

    .header h1{
        font-size:17px;
    }

    .bubble{
        max-width:90%;
        font-size:14px;
    }

}

</style>
</head>


<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            K
        </div>

        <div>
            <h1>Krishna's CSE Guiding BOT</h1>
            <p>Your personal Computer Science study assistant</p>
        </div>

    </div>


    <!-- CHAT -->

    <div class="chat" id="chat">

        <div class="welcome">

            <h2>👋 Hello Krishna!</h2>

            <p>
                Welcome to your personal CSE study assistant.
                Ask me anything about Computer Science.
            </p>

            <div class="subjects">

                <span class="subject">Programming</span>
                <span class="subject">DSA</span>
                <span class="subject">DBMS</span>
                <span class="subject">OS</span>
                <span class="subject">Computer Networks</span>
                <span class="subject">Web Development</span>
                <span class="subject">OOP</span>
                <span class="subject">Software Engineering</span>
                <span class="subject">AI / ML</span>

            </div>

        </div>

    </div>


    <!-- INPUT -->

    <div class="bottom">

        <div class="preview" id="preview">
            <img id="previewImage">
        </div>

        <div class="controls">

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
                onchange="previewImage(event)"
            >

            <button
                class="image-btn"
                onclick="document.getElementById('imageInput').click()"
                title="Upload image"
            >
                📷
            </button>

            <textarea
                id="messageInput"
                placeholder="Ask your CSE question..."
            ></textarea>

            <button
                class="send-btn"
                onclick="sendMessage()"
            >
                Send
            </button>

        </div>

    </div>

</div>


<script>

let selectedImage = null;


/* IMAGE PREVIEW */

function previewImage(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    selectedImage = file;

    const reader = new FileReader();

    reader.onload = function(e){

        document.getElementById("previewImage").src = e.target.result;

        document.getElementById("preview").style.display = "block";

    };

    reader.readAsDataURL(file);
}


/* ADD MESSAGE */

function addMessage(text, type, image=null){

    const chat = document.getElementById("chat");

    const message = document.createElement("div");

    message.className = "message " + type;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    if(image){

        const img = document.createElement("img");

        img.src = image;

        img.className = "image-preview";

        bubble.appendChild(img);

    }

    const textElement = document.createElement("div");

    textElement.innerHTML = text;

    bubble.appendChild(textElement);

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

}


/* IMAGE TO BASE64 */

function fileToBase64(file){

    return new Promise((resolve,reject)=>{

        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}


/* SEND */

async function sendMessage(){

    const input = document.getElementById("messageInput");

    const text = input.value.trim();

    if(!text && !selectedImage){
        return;
    }

    let imageData = null;

    if(selectedImage){

        imageData = await fileToBase64(selectedImage);

    }

    addMessage(
        text || "Please analyze this image.",
        "user",
        imageData
    );

    input.value = "";

    document.getElementById("preview").style.display = "none";

    selectedImage = null;

    document.getElementById("imageInput").value = "";


    /* THINKING */

    const thinkingId = "thinking-" + Date.now();

    addMessage(
        "🤔 Krishna's BOT is thinking...",
        "bot"
    );


    try{

        const response = await fetch("/api/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                message:text,

                image:imageData

            })

        });


        const data = await response.json();


        /* REMOVE THINKING MESSAGE */

        const chat = document.getElementById("chat");

        const messages = chat.querySelectorAll(".message");

        if(messages.length > 0){

            const last = messages[messages.length-1];

            if(last.classList.contains("bot")){

                last.remove();

            }

        }


        if(data.error){

            addMessage(
                "❌ Error: " + data.error,
                "bot"
            );

            return;
        }


        addMessage(
            formatAnswer(data.answer),
            "bot"
        );


    }catch(error){

        const chat = document.getElementById("chat");

        const messages = chat.querySelectorAll(".message");

        if(messages.length > 0){

            messages[messages.length-1].remove();

        }

        addMessage(
            "❌ Server connection error. Backend setup गर्न बाँकी छ।",
            "bot"
        );

    }

}


/* FORMAT ANSWER */

function formatAnswer(text){

    if(!text){
        return "Sorry, I could not generate an answer.";
    }

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/\n/g,"<br>");

}


/* ENTER KEY */

document
.getElementById("messageInput")
.addEventListener("keydown",function(event){

    if(event.key === "Enter" && !event.shiftKey){

        event.preventDefault();

        sendMessage();

    }

});

</script>

</body>
</html>
